[[entry]]
id = 10
tracker_id = "#1822"
type = "story"
title = "The checker, rename tool and clip reader and writer implement plugin blocks and the closed top level"
description = "Cuts the shipped native-data code over to the 2026-11-09 owner rulings in one change, so no file is touched twice: the closed top level (the stamp, a contract's own fields and `pluginData` as the one open dictionary, with the reserved keys), the checker's `plugin-block` class with the three link classes retired, the rename tool without link rewriting or its two link-field options, the clip reader, writer, in-place edit and importer accepting `pluginData` and carrying every block byte for byte, the qualified plugin-id grammar of PKG-2, and the fixtures and clip examples."
verify = "A fixture project with plugin blocks passes the checker, which reports each remaining class and each `plugin-block` problem kind by name and never an unknown key inside `data`; a rename leaves every block byte for byte and the checker clean; a one-property edit of `delay` on a clip that carries blocks changes one line; each preservation test fails against a deliberately regenerating writer; the clip examples gain plugin-bearing valid and invalid cases and are read."
covers = ["E2", "E3", "E4", "E5"]
after = [1, 2, 4, 5]
hitl = false
risk = "medium"
notes = [
  "Boundaries: does not build the plugin definition's `contributes` descriptor, the plugin-present checks or the upgrade command (ADR 0024). They need the plugin catalogue and are planned once the owner approves ADR 0024.",
  "The flat shape of ADR 0023 decision 5 is recommended and awaits the owner's choice against a `core:` wrapper. This story starts when he has chosen; if he picks the wrapper, the clip's fields move under `core` in this same change, which is free while the clip is pre-release.",
  "Scope seen from the docs PR: packages/native-data (check.ts, report.ts, document.ts, rename.ts, clip.ts), native-data-cli and native-data-rename (the --owner-field and --plugins-field options go), native-data-import, packages/core/src/script/manifest.ts and packages/runner-harness/src/package-catalogue.ts (the PKG-2 identifier pattern and the default namespace of a qualified id), their tests and fixtures, docs/spec/examples/native/animation-clip/ (read by packages/native-data/test/clip.test.ts) and the native-data rows of CONTRIBUTING.md.",
]

