type = "story"
title = "A checker reports stamp, ID and link errors in a folder of native documents"
description = "Adds the checker that reads a folder of native documents and reports the six error classes ruled in 27.1, and never repairs anything."
verify = "Authored fixture folders, one per error class plus a clean one, produce exactly the ruled messages; the clean folder reports none."
