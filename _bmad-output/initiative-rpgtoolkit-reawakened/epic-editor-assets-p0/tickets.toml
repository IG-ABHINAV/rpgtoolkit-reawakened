# Epic 12 P0 asset editing; external providers are entry-pinned in the initiative.
[[entry]]
id = 1
tracker_id = "#1712"
type = "story"
title = "Board edit save and render tracer"
description = "Open a small authored board, change one tile, save and reopen it through the shared document lifecycle, and present it using the core board compositor in both web and VS Code hosts."
verify = "A host-conformance proof observes the changed tile after save and reopen in each host and compares its compositor output with the matching engine view."
covers = ["CAP-15"]
after = ["11.2", "11.3", "2.5", "4.14"]
hitl = false
risk = "high"

